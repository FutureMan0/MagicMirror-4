name: CI

on:
  push:
    branches: [main]
  pull_request:

# Mehrere Pushes auf denselben Branch: nur der letzte Lauf zählt.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint & Tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # 20.x ist das, was rpi-install.sh heute auf dem Pi installiert,
        # 22.x das Ziel des geplanten Runtime-Upgrades.
        node: ['20.x', '22.x']

    env:
      # Die Tests brauchen die Electron-Binary nicht. Der Download kostet sonst
      # bei jedem Lauf über 100 MB.
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # npm ci prüft zugleich, dass package-lock.json und package.json
      # zueinander passen. Genau das war lange kaputt: serialport fehlte
      # vollständig im Lockfile.
      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # Ein Theme kann nur umfärben, was über Tokens läuft. Rohe Hex-Werte in
      # Modul-Stylesheets sind für jedes Theme unerreichbar - und fallen im
      # Standard-Theme niemandem auf.
      - name: Token-Disziplin
        run: npm run check:tokens

      - name: Tests
        run: npm test

  # Der einzige Job, der die Anwendung tatsächlich startet. Alles andere prüft
  # Logik und Verdrahtung - nicht, ob Electron das Fenster öffnet, der Renderer
  # lädt und jedes Modul erscheint.
  smoke:
    name: Startprobe (${{ matrix.theme }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # Mehrere Themes durchspielen: so ist wenigstens belegt, dass jedes
        # Stylesheet lädt und das Rendern nicht verhindert. Wie es aussieht,
        # kann eine Startprobe nicht beurteilen.
        theme: [default, minimal, cyberpunk, newspaper]

    env:
      MM_SMOKE_THEME: ${{ matrix.theme }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm

      # Electron braucht unter Linux einen Bildschirm und ein paar
      # Systembibliotheken, die auf dem Runner nicht vorinstalliert sind.
      - name: Systemabhängigkeiten
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 \
            libdrm2 libgbm1 libasound2t64 libgtk-3-0 libxkbcommon0 \
            libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libpango-1.0-0

      # Hier wird die Electron-Binärdatei bewusst mit heruntergeladen -
      # ohne sie gibt es nichts zu starten.
      - name: Install dependencies
        run: npm ci

      - name: App starten und Module prüfen
        run: xvfb-run -a --server-args="-screen 0 1920x1080x24" npm run smoke

  lockfile:
    name: Lockfile ist aktuell
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      # Der Auto-Updater auf dem Pi führt npm ci aus. Driftet das Lockfile,
      # schlägt dort das Update fehl - deshalb hier hart prüfen.
      - name: package-lock.json darf nicht driften
        run: |
          npm install --package-lock-only --no-audit --no-fund
          if ! git diff --quiet -- package-lock.json; then
            echo "::error::package-lock.json ist nicht aktuell. Bitte 'npm install --package-lock-only' ausführen und committen."
            git --no-pager diff --stat -- package-lock.json
            exit 1
          fi
